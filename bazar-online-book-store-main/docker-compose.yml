services:
  frontend:
    build: ./frontend
    container_name: frontend
    environment:
      - CATALOG1_HOST=catalog1
      - CATALOG1_PORT=5001
      - CATALOG2_HOST=catalog2
      - CATALOG2_PORT=5001
      - ORDER1_HOST=order1
      - ORDER1_PORT=5002
      - ORDER2_HOST=order2
      - ORDER2_PORT=5002
      - FRONTEND_PORT=5000
      - REQUEST_TIMEOUT=5
      - CACHE_MAX_ITEMS=200
    depends_on:
      - catalog1
      - catalog2
      - order1
      - order2
    ports:
      - "5000:5000"

  catalog1:
    build: ./catalog
    container_name: catalog1
    environment:
      - CATALOG_REPLICA_NAME=catalog1
      - CATALOG_PEER_URL=http://catalog2:5001
      - FRONTEND_URL=http://frontend:5000
      - CATALOG_FILE=/data/catalog1.csv
      - CATALOG_PORT=5001
      - REQUEST_TIMEOUT=5
    volumes:
      - catalog1_data:/data
    ports:
      - "5001:5001"

  catalog2:
    build: ./catalog
    container_name: catalog2
    environment:
      - CATALOG_REPLICA_NAME=catalog2
      - CATALOG_PEER_URL=http://catalog1:5001
      - FRONTEND_URL=http://frontend:5000
      - CATALOG_FILE=/data/catalog2.csv
      - CATALOG_PORT=5001
      - REQUEST_TIMEOUT=5
    volumes:
      - catalog2_data:/data
  
  order1:
    build: ./order
    container_name: order1
    environment:
      - ORDER_REPLICA_NAME=order1
      - ORDER_PEER_URL=http://order2:5002
      - CATALOG_URL=http://catalog1:5001
      - FRONTEND_URL=http://frontend:5000
      - ORDERS_FILE=/data/orders1.csv
      - ORDER_PORT=5002
      - REQUEST_TIMEOUT=5
    volumes:
      - order1_data:/data
    ports:
      - "5002:5002"
    depends_on:
      - catalog1
      - frontend

  order2:
    build: ./order
    container_name: order2
    environment:
      - ORDER_REPLICA_NAME=order2
      - ORDER_PEER_URL=http://order1:5002
      - CATALOG_URL=http://catalog2:5001
      - FRONTEND_URL=http://frontend:5000
      - ORDERS_FILE=/data/orders2.csv
      - ORDER_PORT=5002
      - REQUEST_TIMEOUT=5
    volumes:
      - order2_data:/data
    depends_on:
      - catalog2
      - frontend

  nginx:
    build: ./nginx
    container_name: nginx
    depends_on:
      - frontend
    command: /bin/sh -c "sleep 3 && nginx -g 'daemon off;'"
    ports:
      - "80:80"

volumes:
  catalog1_data:
  catalog2_data:
  order1_data:
  order2_data:
